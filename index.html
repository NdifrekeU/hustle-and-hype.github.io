<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14110c">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  /* Base reset (the claude.ai viewer supplies this for the artifact build) */
  :root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body { margin: 0; font: 14px system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Hustle &amp; Hype</title>
<meta name="description" content="A Lagos-themed roguelike deckbuilder. Pick a hustler, climb three acts and beat Sapa.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/combat.css">
<link rel="stylesheet" href="css/screens.css">

</head>
<body>
<div id="app">
  <header id="hud" hidden></header>
  <main id="screen" class="screen"></main>
</div>
<div id="fx-layer" aria-hidden="true"></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://lagoslife.app/sdk/vatar-games-v1.js"></script>
<script src="js/platform.js"></script>
<!-- Data: content only -->
<script src="js/data/statuses.js"></script>
<script src="js/data/cards.js"></script>
<script src="js/data/relics.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/creator.js"></script>
<!-- Core: rules, no DOM -->
<script src="js/core/rng.js"></script>
<script src="js/core/combat.js"></script>
<script src="js/core/run.js"></script>
<script src="js/core/daily.js"></script>
<script src="js/core/eventApi.js"></script>
<!-- UI -->
<script src="js/ui/audio.js"></script>
<script src="js/ui/art.js"></script>
<script src="js/ui/cardArt.js"></script>
<script src="js/ui/cardView.js"></script>
<script src="js/ui/board.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/fx.js"></script>
<script src="js/ui/screens/title.js"></script>
<script src="js/ui/screens/map.js"></script>
<script src="js/ui/screens/combat.js"></script>
<script src="js/ui/screens/reward.js"></script>
<script src="js/ui/screens/shop.js"></script>
<script src="js/ui/screens/rest.js"></script>
<script src="js/ui/screens/event.js"></script>
<script src="js/ui/screens/end.js"></script>
<script src="js/main.js"></script>
</body>
</html>
